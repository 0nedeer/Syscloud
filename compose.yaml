# One API and one Worker share the database and recording volume.
x-app: &app
  build: .
  image: recordings-api:local
  environment: &app-env
    DATABASE_URL: "mysql+asyncmy://${MYSQL_USER:?Set MYSQL_USER}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE}?charset=utf8mb4"
    UPLOAD_DIR: /service/data/recordings
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  init: true

services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP --host=127.0.0.1 --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["/service/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - recordings_data:/service/data/recordings
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/service/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *app
    command: ["/service/.venv/bin/python", "-m", "app.worker"]
    environment:
      <<: *app-env
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_STYLE: ${LLM_API_STYLE:-responses}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_PROXY_URL: ${LLM_PROXY_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_MAX_RESPONSE_BYTES: ${LLM_MAX_RESPONSE_BYTES:-262144}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-10}
      WORKER_SHUTDOWN_SECONDS: ${WORKER_SHUTDOWN_SECONDS:-10}
      WORKER_CLEANUP_SECONDS: ${WORKER_CLEANUP_SECONDS:-10}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-2}
    volumes:
      - recordings_data:/service/data/recordings
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  mysql_data:
  recordings_data:
